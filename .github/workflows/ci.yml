name: product-gate
on:
  pull_request:
  push: {branches: [main]}
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: 1.99.1, components: rustfmt,clippy}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm --prefix frontend ci
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Verify complete product
        run: DREAM_MACHINE_EVIDENCE_DIR="${RUNNER_TEMP}/patch-cage-evidence" ./scripts/verify-prototype.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: patch-cage-evidence-${github.sha}, path: '${runner.temp}/patch-cage-evidence', if-no-files-found: error}
