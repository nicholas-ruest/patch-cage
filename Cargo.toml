[workspace]
resolver = "2"
members = [
  "crates/pc-types",
  "crates/pc-ingest",
  "crates/pc-repository",
  "crates/pc-change-graph",
  "crates/pc-policy",
  "crates/pc-authz",
  "crates/pc-approval",
  "crates/pc-sandbox-plan",
  "crates/pc-sandbox-runner",
  "crates/pc-risk-engine",
  "crates/pc-ruvector",
  "crates/pc-rvf-ledger",
  "crates/pc-ruflo",
  "crates/pc-metaharness",
  "crates/pc-rune",
  "crates/pc-synthlang",
  "crates/pc-openfeature",
  "crates/pc-telemetry",
  "crates/pc-review",
  "crates/pc-release",
  "crates/pc-audit",
  "crates/pc-app",
  "crates/pc-api"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features=["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version="1.18.1", features=["v4","serde"] }
chrono = { version="0.4.42", features=["serde"] }
tokio = { version="1.48.0", features=["full"] }
axum = "0.8.6"
tower-http = { version="0.6.6", features=["cors","trace","request-id","timeout"] }
tracing = "0.1.41"
tracing-subscriber = { version="0.3.20", features=["env-filter","json"] }
async-trait = "0.1.89"
sha2 = "0.10.9"
hex = "0.4.3"
anyhow = "1.0.100"
