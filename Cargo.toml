[package]
name = "patch-cage"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Fail-closed policy checks for Git patches before remediation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicholas-ruest/patch-cage"
readme = "README.md"
keywords = ["git", "patch", "policy", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "=0.4.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
